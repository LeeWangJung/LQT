<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories ✨</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    overflow:hidden;

    font-family:sans-serif;

    height:100vh;

    background:
    url("8.jpg")
    center center / cover no-repeat fixed;

    position:relative;
}

/* DARK OVERLAY */

body::before{

    content:"";

    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,0.38);

    z-index:0;
}

/* STARS */

canvas{

    position:fixed;

    inset:0;

    z-index:1;
}

/* INTRO */

#intro{

    position:fixed;

    inset:0;

    background:black;

    display:flex;

    justify-content:center;
    align-items:center;

    z-index:99999;

    transition:1s;
}

#intro h1{

    color:white;

    font-size:55px;

    letter-spacing:6px;

    text-shadow:
    0 0 15px #ff99cc,
    0 0 40px #ff99cc;

    animation:blink 1s infinite alternate;
}

@keyframes blink{

    from{
        opacity:0.4;
        transform:scale(1);
    }

    to{
        opacity:1;
        transform:scale(1.06);
    }

}

/* TITLE */

.title{

    position:absolute;

    top:28px;

    width:100%;

    text-align:center;

    color:white;

    font-size:40px;

    letter-spacing:6px;

    z-index:10;

    text-shadow:
    0 0 10px #ff99cc,
    0 0 35px #ff99cc;
}

/* WALL */

.wall{

    width:100%;
    height:100vh;

    display:flex;

    justify-content:center;
    align-items:center;

    position:relative;

    z-index:5;
}

/* GRID */

.grid{

    position:relative;

    width:820px;
    height:470px;

    border:
    2px solid rgba(255,255,255,0.22);

    border-radius:14px;

    overflow:visible;

    isolation:isolate;

    background:

    linear-gradient(
    rgba(255,255,255,0.14) 2px,
    transparent 2px),

    linear-gradient(
    90deg,
    rgba(255,255,255,0.14) 2px,
    transparent 2px);

    background-size:
    60px 60px;

    background-color:
    rgba(255,255,255,0.04);

    backdrop-filter:
    blur(9px);

    box-shadow:
    0 0 35px rgba(255,255,255,0.08);
}

/* GRID IMAGE */

.grid::before{

    content:"";

    position:absolute;

    inset:0;

    background:
    url("6.jpg")
    center/cover no-repeat;

    opacity:0.22;

    z-index:1;

    pointer-events:none;

    border-radius:14px;
}

/* PHOTO */

.photo{

    position:absolute;

    width:175px;

    background:white;

    padding:
    8px
    8px
    30px;

    border-radius:6px;

    box-shadow:
    0 12px 25px rgba(0,0,0,0.35);

    cursor:pointer;

    transition:
    transform 0.4s,
    box-shadow 0.4s;

    z-index:5;
}

/* PHOTO IMG */

.photo img{

    width:100%;

    height:175px;

    object-fit:cover;

    border-radius:4px;
}

/* TEXT */

.caption{

    margin-top:10px;

    text-align:center;

    color:#444;

    font-size:14px;

    letter-spacing:1px;
}

/* PIN */

.pin{

    position:absolute;

    width:16px;
    height:16px;

    border-radius:50%;

    background:#ff6ea8;

    top:-10px;
    left:50%;

    transform:translateX(-50%);

    box-shadow:
    0 0 12px #ff6ea8;
}

/* DESKTOP POSITIONS */

.p1{

    top:25px;
    left:70px;

    transform:rotate(-8deg);

    z-index:3;
}

.p2{

    top:35px;
    left:330px;

    transform:rotate(5deg);

    z-index:6;
}

.p3{

    top:255px;
    left:190px;

    transform:rotate(-5deg);

    z-index:7;
}

.p4{

    top:215px;
    left:510px;

    transform:rotate(7deg);

    z-index:4;
}

.p5{

    top:95px;
    left:610px;

    transform:rotate(-7deg);

    z-index:8;
}

/* HOVER */

.photo:hover{

    transform:
    scale(1.05)
    rotate(0deg);

    z-index:50;

    box-shadow:
    0 0 35px rgba(255,180,220,0.8);
}

/* ACTIVE */

.photo.active{

    position:fixed !important;

    top:50% !important;
    left:50% !important;

    transform:
    translate(-50%,-50%)
    scale(1.45)
    rotate(0deg) !important;

    z-index:9999;

    box-shadow:
    0 0 40px rgba(255,180,220,0.9),
    0 0 90px rgba(255,180,220,0.5);
}

/* MOBILE */

@media(max-width:768px){

    body{
        overflow:hidden;
    }

    .title{

        font-size:22px;

        letter-spacing:4px;

        top:22px;
    }

    #intro h1{

        font-size:30px;
    }

    .grid{

        width:92vw;

        height:72vh;

        border-radius:16px;

        background-size:
        42px 42px;

        backdrop-filter:
        blur(10px);
    }

    .grid::before{

        border-radius:16px;
    }

    .photo{

        width:128px;

        padding:
        7px
        7px
        22px;

        border-radius:10px;
    }

    .photo img{

        height:128px;

        border-radius:6px;
    }

    .caption{

        font-size:11px;

        margin-top:8px;
    }

    /* MOBILE POSITIONS */

    .p1{

        top:45px;
        left:10px;

        transform:rotate(-7deg);
    }

    .p2{

        top:55px;
        right:15px;
        left:auto;

        transform:rotate(5deg);
    }

    .p3{

        top:300px;
        left:25px;

        transform:rotate(-5deg);

        z-index:7;
    }

    .p4{

        top:310px;
        right:20px;
        left:auto;

        transform:rotate(6deg);
    }

    .p5{

        top:180px;
        left:50%;

        transform:
        translateX(-50%)
        rotate(-3deg);

        z-index:9;
    }

    .photo.active{

        transform:
        translate(-50%,-50%)
        scale(1.65)
        rotate(0deg) !important;
    }

}

</style>
</head>

<body>

<!-- INTRO -->

<div id="intro">

    <h1>CLICK TO ENTER ✨</h1>

</div>

<!-- TITLE -->

<div class="title">

    OUR MEMORIES ✨

</div>

<!-- STARS -->

<canvas id="stars"></canvas>

<!-- WALL -->

<div class="wall">

    <div class="grid">

        <!-- PHOTO 1 -->

        <div class="photo p1">

            <div class="pin"></div>

            <img src="1.jpg">

            <div class="caption">

                Beautiful ✨

            </div>

        </div>

        <!-- PHOTO 2 -->

        <div class="photo p2">

            <div class="pin"></div>

            <img src="2.jpg">

            <div class="caption">

                Memories 🌸

            </div>

        </div>

        <!-- PHOTO 3 -->

        <div class="photo p3">

            <div class="pin"></div>

            <img src="3.jpg">

            <div class="caption">

                Smile 💖

            </div>

        </div>

        <!-- PHOTO 4 -->

        <div class="photo p4">

            <div class="pin"></div>

            <img src="4.jpg">

            <div class="caption">

                Forever ✨

            </div>

        </div>

        <!-- PHOTO 5 -->

        <div class="photo p5">

            <div class="pin"></div>

            <img src="5.jpg">

            <div class="caption">

                My Favorite 💕

            </div>

        </div>

    </div>

</div>

<!-- MUSIC -->

<audio id="music" loop playsinline>

    <source src="1.mp3" type="audio/mpeg">

</audio>

<script>

/* INTRO */

const intro =
document.getElementById(
"intro"
);

intro.addEventListener(
"click",
()=>{

    intro.style.opacity = "0";

    setTimeout(()=>{

        intro.style.display =
        "none";

    },1000);

    const music =
    document.getElementById(
    "music"
    );

    music.volume = 1;

    music.play().catch(()=>{});

},
{ once:true });

/* PHOTO ZOOM */

const photos =
document.querySelectorAll(".photo");

let current = null;

photos.forEach(photo=>{

    photo.addEventListener(
    "click",
    (e)=>{

        e.stopPropagation();

        if(current === photo){

            photo.classList.remove(
            "active"
            );

            current = null;

            return;
        }

        if(current){

            current.classList.remove(
            "active"
            );

        }

        photo.classList.add(
        "active"
        );

        current = photo;

    });

});

/* STARS */

const canvas =
document.getElementById(
"stars"
);

const ctx =
canvas.getContext("2d");

canvas.width =
innerWidth;

canvas.height =
innerHeight;

const stars = [];

const count =
window.innerWidth < 768
? 75
: 150;

for(let i=0;i<count;i++){

    stars.push({

        x:
        Math.random()*canvas.width,

        y:
        Math.random()*canvas.height,

        r:
        Math.random()*2,

        s:
        Math.random()*1.6 + 0.6

    });

}

function animate(){

    requestAnimationFrame(
    animate
    );

    ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
    );

    for(let star of stars){

        ctx.beginPath();

        ctx.arc(
        star.x,
        star.y,
        star.r,
        0,
        Math.PI*2
        );

        ctx.fillStyle =
        "white";

        ctx.fill();

        star.y += star.s;

        if(star.y >
        canvas.height){

            star.y = 0;

            star.x =
            Math.random()*
            canvas.width;

        }

    }

}

animate();

/* RESIZE */

window.addEventListener(
"resize",
()=>{

    canvas.width =
    innerWidth;

    canvas.height =
    innerHeight;

});

</script>

</body>
</html>
